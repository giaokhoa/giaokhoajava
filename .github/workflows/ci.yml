name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    if: always()
    needs: [backend-build, backend-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: test '${{ needs.backend-build.result }}' = success && test '${{ needs.backend-checks.result }}' = success

  backend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Java quality gates and unit tests
        run: ./backend/mvnw -B -ntp -f backend/pom.xml clean verify
      - name: Upload backend quality reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-quality-reports
          path: |
            backend/target/pmd.xml
            backend/target/spotbugsXml.xml
            backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Chỉ phát hành artifact khi compile, unit test và ba cổng tĩnh đều đạt.
      - name: Upload verified backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          overwrite: true
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/*.jar
          if-no-files-found: error
          retention-days: 1

  backend-checks:
    name: backend (${{ matrix.tier }})
    needs: backend-build
    strategy:
      fail-fast: false
      matrix:
        tier: [it-pure, e2e-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:15432/giaokhoa_test
      TEST_DATABASE_USERNAME: giaokhoa_test
      TEST_DATABASE_PASSWORD: test-only-password
      TEST_DATABASE_MIGRATOR_USERNAME: giaokhoa_test
      TEST_DATABASE_MIGRATOR_PASSWORD: test-only-password
      TEST_KEYCLOAK_BASE_URL: http://127.0.0.1:18081
      TEST_KEYCLOAK_REALM: giaokhoa-it
      TEST_KEYCLOAK_MASTER_USERNAME: test-admin
      TEST_KEYCLOAK_MASTER_PASSWORD: test-only-password
      TEST_OIDC_CLIENT_ID: giaokhoa-it-web
      TEST_OIDC_CLIENT_SECRET: ci-web-client-only
      TEST_KEYCLOAK_ADMIN_CLIENT_ID: giaokhoa-it-fixtures
      TEST_KEYCLOAK_ADMIN_CLIENT_SECRET: ci-fixtures-only
      TEST_KEYCLOAK_PROVISIONER_CLIENT_ID: giaokhoa-it-fixtures
      TEST_KEYCLOAK_PROVISIONER_CLIENT_SECRET: ci-fixtures-only
      TEST_KEYCLOAK_AUTHZ_AUDIENCE: giaokhoa-it-api
      TEST_APP_ORIGIN: http://127.0.0.1:8080
      TEST_MAILPIT_URL: http://127.0.0.1:18025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Download verified backend build
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/target
      # Integration test của backend khẳng định thẳng trên DB/Keycloak thật nên job
      # backend tự dựng stack TEST riêng, giống hệt cách job integration trước đây làm.
      - name: Start isolated TEST services
        run: |
          docker compose -p giaokhoa-test -f infra/compose.test.yaml up -d --wait --wait-timeout 180
          curl -fsS --retry 40 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18081/realms/giaokhoa-it/.well-known/openid-configuration -o /dev/null
          docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:18081 --realm master --user test-admin --password test-only-password
          docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh add-roles -r giaokhoa-it --uusername service-account-giaokhoa-it-fixtures --cclientid realm-management --rolename manage-users
          # Policy graph writer production chạy trong integration context bằng credential
          # của fixtures: cấp cho writer các role mà bootstrap.sh cấp cho provisioner
          # production (đọc client, đọc/ghi authorization, tra cứu group-by-path,
          # đọc/ghi organizations để tạo Organization cho center),
          # nếu không các lời gọi của writer bị từ chối với 403.
          for role in view-clients view-authorization manage-authorization query-groups manage-organizations view-organizations query-organizations; do
            docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh add-roles -r giaokhoa-it --uusername service-account-giaokhoa-it-fixtures --cclientid realm-management --rolename "$role"
          done
      - name: Verify implemented Spring integration tests
        run: ./backend/mvnw -B -ntp -f backend/pom.xml -Pintegration,${{ matrix.tier }} failsafe:integration-test failsafe:verify
      - name: Upload backend integration reports
        if: always()
        # Báo cáo phục vụ chẩn đoán; lỗi quota không được thay đổi kết quả lint/test.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-reports-${{ matrix.tier }}
          path: backend/target/failsafe-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: TEST logs on failure
        if: failure()
        run: docker compose -p giaokhoa-test -f infra/compose.test.yaml logs --tail=100

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Next.js
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm --prefix frontend run build

  integration:
    if: always()
    needs: [backend-build, integration-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: test '${{ needs.backend-build.result }}' = success && test '${{ needs.integration-checks.result }}' = success

  integration-checks:
    name: integration (${{ matrix.project }})
    needs: backend-build
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-core, chromium-teaching-guardians]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:15432/giaokhoa_test
      TEST_DATABASE_USERNAME: giaokhoa_test
      TEST_DATABASE_PASSWORD: test-only-password
      TEST_DATABASE_MIGRATOR_USERNAME: giaokhoa_test
      TEST_DATABASE_MIGRATOR_PASSWORD: test-only-password
      TEST_KEYCLOAK_BASE_URL: http://127.0.0.1:18081
      TEST_KEYCLOAK_REALM: giaokhoa-it
      TEST_KEYCLOAK_MASTER_USERNAME: test-admin
      TEST_KEYCLOAK_MASTER_PASSWORD: test-only-password
      TEST_OIDC_CLIENT_ID: giaokhoa-it-web
      TEST_OIDC_CLIENT_SECRET: ci-web-client-only
      TEST_KEYCLOAK_ADMIN_CLIENT_ID: giaokhoa-it-fixtures
      TEST_KEYCLOAK_ADMIN_CLIENT_SECRET: ci-fixtures-only
      TEST_KEYCLOAK_PROVISIONER_CLIENT_ID: giaokhoa-it-fixtures
      TEST_KEYCLOAK_PROVISIONER_CLIENT_SECRET: ci-fixtures-only
      TEST_KEYCLOAK_AUTHZ_AUDIENCE: giaokhoa-it-api
      TEST_APP_ORIGIN: http://127.0.0.1:8080
      NATIVE_GATE_APP_ORIGIN: http://127.0.0.1:8080
      TEST_FRONTEND_ORIGIN: http://127.0.0.1:8080
      # Schema riêng của lượt E2E: playwright.config.ts đặt TEST_E2E_SCHEMA ngẫu nhiên,
      # run-backend.sh và các spec seed kết quả mẫu đều dùng đúng tên đó cho backend.
      # E2E_SCHEMA chỉ còn là dự phòng của run-backend.sh khi chạy ngoài Playwright.
      E2E_SCHEMA: e2e_ci
      TEST_MAILPIT_URL: http://127.0.0.1:18025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Download verified backend build
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/target
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      # Hệ điều hành runner là mới mỗi job dù cache browser có hit: luôn cài thư viện OS.
      - name: Install Playwright system dependencies
        run: cd frontend && npx playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium
      - name: Start isolated TEST services
        run: |
          docker compose -p giaokhoa-test -f infra/compose.test.yaml up -d --wait --wait-timeout 180
          curl -fsS --retry 40 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18081/realms/giaokhoa-it/.well-known/openid-configuration -o /dev/null
          docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:18081 --realm master --user test-admin --password test-only-password
          docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh add-roles -r giaokhoa-it --uusername service-account-giaokhoa-it-fixtures --cclientid realm-management --rolename manage-users
          # Policy graph writer production chạy trong integration context bằng credential
          # của fixtures: cấp cho writer các role mà bootstrap.sh cấp cho provisioner
          # production (đọc client, đọc/ghi authorization, tra cứu group-by-path,
          # đọc/ghi organizations để tạo Organization cho center),
          # nếu không các lời gọi của writer bị từ chối với 403.
          for role in view-clients view-authorization manage-authorization query-groups manage-organizations view-organizations query-organizations; do
            docker compose -p giaokhoa-test -f infra/compose.test.yaml exec -T test-keycloak /opt/keycloak/bin/kcadm.sh add-roles -r giaokhoa-it --uusername service-account-giaokhoa-it-fixtures --cclientid realm-management --rolename "$role"
          done
      - name: Verify frontend/backend E2E with PostgreSQL and Keycloak
        run: npm --prefix frontend run test:e2e -- --project=${{ matrix.project }}
      - name: Upload E2E reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native Keycloak bootstrap and provisioning
        if: matrix.project == 'chromium-core'
        run: bash infra/keycloak/verify-native.sh --use-build-artifact
      - name: Verify signed OIDC back-channel logout across restart
        if: matrix.project == 'chromium-core'
        run: node infra/keycloak/verify-oidc-logout.mjs
      - name: TEST logs on failure
        if: failure()
        run: docker compose -p giaokhoa-test -f infra/compose.test.yaml logs --tail=100
