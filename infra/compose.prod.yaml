# Stack production: Dokploy dựng từ file này trên server riêng, public qua
# Cloudflare Tunnel tới gateway (xem infra/DEPLOY.md trước khi dựng lần đầu).
# Lệnh tương đương khi chạy tay:
#   docker compose --env-file .env.prod -f infra/compose.prod.yaml up -d
name: giaokhoa-prod

services:
  # POSTGRES_USER ở đây là role owner của database: giữ vai trò migration cho
  # Flyway (mẫu DEV/TEST của repo — xem backend/README.md, mục "Vai trò
  # database"). Runtime của ứng dụng dùng role giaokhoa_runtime riêng bên dưới.
  app-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: giaokhoa
      POSTGRES_USER: giaokhoa
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - prod_app_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giaokhoa -d giaokhoa"]
      interval: 5s
      retries: 10

  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - prod_keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Production chạy `start`, không `start-dev`. Realm KHÔNG import tại đây:
    # realm được dựng bằng infra/keycloak/bootstrap.sh sau khi Keycloak lên
    # (script tạo realm ở trạng thái tắt, gỡ quyền mặc định rồi mới bật).
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
      # TLS kết thúc ở Cloudflare Tunnel và gateway: Keycloak phục vụ HTTP
      # trong mạng nội bộ nhưng phát hành token theo hostname https công khai.
      KC_HOSTNAME: https://auth.fuckr.net
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ORIGIN: https://giaokhoa.fuckr.net
      OIDC_ISSUER_URI: https://auth.fuckr.net/realms/giaokhoa
      OIDC_CLIENT_ID: giaokhoa-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      KEYCLOAK_AUTHZ_AUDIENCE: giaokhoa-api
      # Admin API và Protection API đi thẳng qua mạng nội bộ; chỉ OIDC
      # discovery/token đi theo issuer công khai như trình duyệt thấy.
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_PROVISIONER_CLIENT_ID: giaokhoa-provisioner
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?Set KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/giaokhoa
      SPRING_DATASOURCE_USERNAME: giaokhoa_runtime
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
      # Vai trò migration là chính role owner của app-db: baseline cần quyền
      # tạo role giaokhoa_runtime nên không tách role migration riêng ở đây.
      SPRING_FLYWAY_USER: giaokhoa
      SPRING_FLYWAY_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  gateway:
    image: caddy:2.10.2-alpine
    # Cổng host duy nhất của toàn stack: Cloudflare Tunnel trỏ cả bốn
    # hostname (giaokhoa, auth, trung-tam-1, trung-tam-2) vào cổng này.
    ports:
      - "127.0.0.1:30080:80"
    volumes:
      - ./gateway/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
      - keycloak

  # Hứng thư SMTP nội bộ cho Keycloak (verify email, đặt lại mật khẩu):
  # không mở cổng ra host, cấu hình SMTP trong realm trỏ host mailpit,
  # port 1025 (xem infra/DEPLOY.md).
  mailpit:
    image: axllent/mailpit:v1.33.0

volumes:
  prod_app_data:
  prod_keycloak_data:
