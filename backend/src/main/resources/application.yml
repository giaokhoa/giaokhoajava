spring:
  application:
    name: giaokhoa
  # Datasource runtime phải là role bị giới hạn giaokhoa_runtime do migration V027 tạo
  # (không owner, không BYPASSRLS) để RLS có hiệu lực; Flyway bên dưới giữ role migration riêng.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
  jpa:
    hibernate:
      # Không validate toàn cục: validate lúc khởi động chỉ kiểm được schema hệ thống
      # (Hibernate User Guide §24.3.4 — schema export/validate không làm việc với
      # multitenancy), không kiểm được schema tenant. Tính đúng đắn của schema do
      # Flyway bảo đảm theo từng dòng migration (hệ thống + tenant) và IT cách ly.
      ddl-auto: none
    properties:
      hibernate:
        # Gửi INSERT/UPDATE theo lô qua JDBC batch cho các vòng ghi nhiều hàng cùng loại
        # (chiếu policy, ghi hàng đợi operation); Hibernate chỉ batch khi id do ứng dụng
        # cấp như UUID ở đây, không batch với id IDENTITY do database sinh.
        jdbc:
          batch_size: 50
    open-in-view: false
  session:
    # Chốt tường minh bằng đúng mặc định của Spring Session (30 phút).
    timeout: 30m
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: [openid, profile, email]
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI}
  # Hai tác vụ nền (projection poll 1 giây và dọn phiên OIDC mỗi giờ) không dùng chung scheduler
  # mặc định một luồng của Boot: một tác vụ chậm không được phép trễ tác vụ còn lại.
  task:
    scheduling:
      pool:
        size: 2

server:
  forward-headers-strategy: framework
  servlet:
    session:
      # Chốt tường minh đúng thời hạn phiên hiện hành để thay đổi mặc định của framework
      # không lặng lẽ đổi hành vi phiên.
      timeout: 30m

# Chỉ mở health cho kiểm tra sống; show-details mặc định never nên đáp án chỉ lộ trạng thái tổng.
management:
  endpoints:
    web:
      exposure:
        include: health

# traceId do TraceIdFilter đặt vào MDC ở đầu mỗi request; cùng một giá trị xuất hiện trong log
# và trong member traceId của đáp án lỗi để đối chiếu hai phía.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [%X{traceId:-}] - %msg%n"

giaokhoa:
  app-origin: ${APP_ORIGIN}
  tenancy:
    # Công tắc điểm dừng của đợt di trú schema-per-tenant: false thì workspace mới không được
    # cấp schema riêng nữa và toàn hệ thống chạy như trước đợt di trú (schema hệ thống).
    provisioning-enabled: ${TENANCY_PROVISIONING_ENABLED:true}
  keycloak:
    authorization-audience: ${KEYCLOAK_AUTHZ_AUDIENCE}
    admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL}
    provisioner:
      client-id: ${KEYCLOAK_PROVISIONER_CLIENT_ID}
      client-secret: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET}
